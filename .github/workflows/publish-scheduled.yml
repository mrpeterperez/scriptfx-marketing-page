name: Publish scheduled articles
on:
  schedule:
    - cron: '15 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: vars.SCHEDULED_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Request deployment
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          test -n "$DEPLOY_HOOK"
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
